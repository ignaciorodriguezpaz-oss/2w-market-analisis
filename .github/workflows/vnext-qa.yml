name: VNext QA
on:
  push:
    branches: [vnext]
    paths:
      - 'vnext/**'
      - 'scripts/test-vnext-engine.mjs'
      - '.github/workflows/vnext-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check VNext JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find vnext -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Forecast engine invariants
        run: node scripts/test-vnext-engine.mjs
      - name: Index asset references exist
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('vnext/index.html').read_text()
          refs=re.findall(r'(?:src|href)="([^"]+)"',html)
          missing=[]
          for ref in refs:
            if ref.startswith(('http://','https://')): continue
            if ref.startswith('/public/'):
              p=Path(ref.lstrip('/'))
            elif ref.startswith('/auth'):
              p=Path(ref.lstrip('/'))
            elif ref.startswith('./'):
              p=Path('vnext')/ref[2:]
            else:
              continue
            if not p.exists(): missing.append(str(p))
          if missing:
            raise SystemExit('Missing assets: '+', '.join(missing))
          print(f'Checked {len(refs)} asset references; all repository assets exist.')
          PY